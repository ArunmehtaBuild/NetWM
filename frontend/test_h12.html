<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NetWM H-12 (Large-Upload States & Errors) Verification Suite</title>
  <style>
    body {
      background: #0f1216;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 24px;
      line-height: 1.5;
    }
    h1 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #8b98a5;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .test-card {
      background: #161b22;
      border: 1px solid #2a3038;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .test-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .test-title {
      font-weight: 600;
      font-size: 14px;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .pass {
      background: rgba(46, 160, 67, 0.2);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.4);
    }
    .fail {
      background: rgba(226, 87, 76, 0.2);
      color: #e2574c;
      border: 1px solid rgba(226, 87, 76, 0.4);
    }
    .pending {
      background: rgba(242, 165, 65, 0.2);
      color: #f2a541;
      border: 1px solid rgba(242, 165, 65, 0.4);
    }
    .test-body {
      font-size: 12.5px;
      color: #8b98a5;
    }
    .summary-box {
      margin-top: 24px;
      padding: 14px 18px;
      background: #1c2230;
      border-radius: 6px;
      border-left: 4px solid #38bdf8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>NetWM H-12 Verification Suite</h1>
  <div class="subtitle">Validating Upload Progress, Cancel Lifecycle, Honest Errors & UI States</div>

  <div id="testContainer"></div>
  <div class="summary-box" id="summaryBox">Running tests...</div>

  <!-- Hidden DOM elements for UploadPanel testing -->
  <div id="testUploadModal" class="hidden">
    <div id="uploadDropzone">
      <input type="file" id="captureFileInput">
      <button id="btnBrowseFiles"></button>
    </div>
    <div id="uploadDemoPresets">
      <button class="demo-preset-chip" data-demo="thursday" data-name="Thursday"></button>
    </div>
    <div id="uploadFileInfoCard" class="hidden">
      <span id="uploadFileNameText"></span>
      <span id="uploadFileSizeText"></span>
      <span id="uploadStatusPill" class="status-pill pill-uploading">UPLOADING</span>
    </div>
    <div id="uploadProgressContainer" class="hidden">
      <div id="uploadProgressBarFill" style="width:0%"></div>
      <span id="uploadStageText"></span>
      <span id="uploadPercentText">0%</span>
    </div>
    <div id="uploadErrorBanner" class="hidden">
      <span id="uploadErrorCode"></span>
      <span id="uploadErrorMessageText"></span>
      <button id="btnRetryUpload"></button>
    </div>
    <button id="btnCloseUploadModal"></button>
    <button id="btnCancelUpload">Cancel</button>
    <button id="btnUploadCapture"></button>
  </div>

  <script type="module">
    import { api, ApiClient } from "./js/api.js";
    import { UploadPanel } from "./js/panels/upload.js";

    const tests = [
      {
        id: "t1_validation_caps",
        title: "Test 1: Format Validation & Size Caps (200MB CSV, 2GB PCAP, 0-byte)",
        async run() {
          const client = new ApiClient();

          const empty = { name: "empty.csv", size: 0 };
          const valEmpty = client.validateCaptureFile(empty);
          if (valEmpty.valid || valEmpty.code !== "bad_file") {
            throw new Error(`0-byte file expected bad_file, got ${JSON.stringify(valEmpty)}`);
          }

          const txt = { name: "logs.txt", size: 1024 };
          const valTxt = client.validateCaptureFile(txt);
          if (valTxt.valid || valTxt.code !== "unsupported_format") {
            throw new Error(`.txt file expected unsupported_format, got ${JSON.stringify(valTxt)}`);
          }

          const bigCsv = { name: "large.csv", size: 205 * 1024 * 1024 };
          const valBigCsv = client.validateCaptureFile(bigCsv);
          if (valBigCsv.valid || valBigCsv.code !== "too_large") {
            throw new Error(`>200MB CSV expected too_large, got ${JSON.stringify(valBigCsv)}`);
          }

          const goodCsv = { name: "valid.csv", size: 10 * 1024 * 1024 };
          const valGoodCsv = client.validateCaptureFile(goodCsv);
          if (!valGoodCsv.valid) {
            throw new Error(`Valid 10MB CSV failed validation: ${JSON.stringify(valGoodCsv)}`);
          }

          const bigPcap = { name: "dump.pcap", size: 2.2 * 1024 * 1024 * 1024 };
          const valBigPcap = client.validateCaptureFile(bigPcap);
          if (valBigPcap.valid || valBigPcap.code !== "too_large") {
            throw new Error(`>2GB PCAP expected too_large, got ${JSON.stringify(valBigPcap)}`);
          }

          const goodPcap = { name: "dump.pcapng", size: 100 * 1024 * 1024 };
          const valGoodPcap = client.validateCaptureFile(goodPcap);
          if (!valGoodPcap.valid) {
            throw new Error(`Valid 100MB PCAPNG failed validation: ${JSON.stringify(valGoodPcap)}`);
          }

          return "All client-side format & size cap rules enforced correctly.";
        }
      },
      {
        id: "t2_mock_upload_progress",
        title: "Test 2: Mock Mode Upload & Multi-Stage Progress Tracking",
        async run() {
          const client = new ApiClient();
          client.useMock = true;

          const progressEvents = [];
          const file = { name: "mock_test.csv", size: 15 * 1024 * 1024 };
          const result = await client.uploadCapture(file, (prog) => {
            progressEvents.push({ ...prog });
          });

          if (!result || !result.isMock) {
            throw new Error("Expected mock result with isMock=true");
          }
          if (progressEvents.length < 6) {
            throw new Error(`Expected at least 6 progress updates, got ${progressEvents.length}`);
          }
          if (progressEvents[0].state !== "uploading") {
            throw new Error(`Initial state should be 'uploading', got '${progressEvents[0].state}'`);
          }
          if (progressEvents[progressEvents.length - 1].state !== "done") {
            throw new Error(`Final state should be 'done', got '${progressEvents[progressEvents.length - 1].state}'`);
          }

          return `Mock pipeline emitted ${progressEvents.length} distinct stages cleanly up to 100%.`;
        }
      },
      {
        id: "t3_mock_upload_cancellation",
        title: "Test 3: Mock Mode In-Flight Cancellation Lifecycle",
        async run() {
          const client = new ApiClient();
          client.useMock = true;

          const file = { name: "cancel_test.csv", size: 25 * 1024 * 1024 };
          const uploadPromise = client.uploadCapture(file);

          // Trigger cancel while pipeline is running
          await new Promise(r => setTimeout(r, 100));
          const didCancel = client.cancelUpload();
          if (!didCancel) {
            throw new Error("cancelUpload() returned false when upload was active");
          }

          try {
            await uploadPromise;
            throw new Error("uploadCapture should have rejected upon cancel");
          } catch (err) {
            if (err.code !== "cancelled") {
              throw new Error(`Expected error code 'cancelled', got '${err.code}'`);
            }
          }

          return "Mock upload aborted cleanly with error code 'cancelled'.";
        }
      },
      {
        id: "t4_live_backend_error_handling",
        title: "Test 4: Live Backend Rejection & Honest Error Codes (No Silent Mock Fallback)",
        async run() {
          const client = new ApiClient();
          client.useMock = false;

          // Test rejection of empty file by direct fetch
          const formData = new FormData();
          const emptyBlob = new Blob([], { type: "text/csv" });
          formData.append("file", emptyBlob, "empty.csv");

          const res = await fetch(`${client.apiBase}/api/analyze`, {
            method: "POST",
            body: formData,
          });

          if (res.status !== 400) {
            throw new Error(`Expected HTTP 400 for empty file, got ${res.status}`);
          }
          const errPayload = await res.json();
          if (!errPayload.error || errPayload.error.code !== "bad_file") {
            throw new Error(`Expected error code 'bad_file', got: ${JSON.stringify(errPayload)}`);
          }

          return `Live backend returns status 400 with code '${errPayload.error.code}' ('${errPayload.error.message}').`;
        }
      },
      {
        id: "t5_live_xhr_upload_and_cancellation",
        title: "Test 5: Live XHR Upload Progress & Pre-Job Network Cancellation",
        async run() {
          const client = new ApiClient();
          client.useMock = false;

          // Create a valid dummy CSV blob
          const csvLines = ["Timestamp,Flow Duration,Destination Port,Total Fwd Packets,Total Backward Packets\n"];
          for (let i = 0; i < 500; i++) {
            csvLines.push(`2017-07-06 12:00:0${i % 60},1000,80,5,5\n`);
          }
          const dummyBlob = new Blob(csvLines, { type: "text/csv" });
          const testFile = new File([dummyBlob], "test_cancel_flow.csv", { type: "text/csv" });

          let uploadStarted = false;
          const uploadPromise = client._uploadCaptureLive(testFile, (prog) => {
            if (prog.state === "uploading") {
              uploadStarted = true;
            }
          });

          // Abort immediately while XHR is in-flight
          const didCancel = client.cancelUpload();

          try {
            await uploadPromise;
            // If it resolved before abort (e.g. localhost instant speed), it's ok, but let's check cancel was called
          } catch (err) {
            if (err.code !== "cancelled" && err.code !== "stopped_waiting") {
              throw new Error(`Expected cancellation error code, got: ${err.code} (${err.message})`);
            }
          }

          return "XHR in-flight upload aborted cleanly without server job registration.";
        }
      },
      {
        id: "t6_honest_stopped_waiting_semantics",
        title: "Test 6: Honest Post-Submission Cancellation Semantics (No False 'Server Job Cancelled')",
        async run() {
          const client = new ApiClient();
          client.useMock = false;

          // Test stopping polling on an existing/mock job
          const fakeJobId = "job_test_polling_abort";
          let caughtError = null;

          const pollPromise = client._pollJob(fakeJobId, () => {});
          // Immediately cancel poll controller
          client.cancelUpload();

          try {
            await pollPromise;
          } catch (err) {
            caughtError = err;
          }

          if (!caughtError) {
            throw new Error("Expected polling to reject upon cancellation");
          }
          if (caughtError.code !== "stopped_waiting") {
            throw new Error(`Expected error code 'stopped_waiting', got '${caughtError.code}'`);
          }
          if (caughtError.message.toLowerCase().includes("cancelled successfully")) {
            throw new Error("UI/Client must not claim 'server job was cancelled successfully'");
          }
          if (!caughtError.wasAnalyzing) {
            throw new Error("Expected wasAnalyzing flag to be true");
          }

          return `Client honest stopped waiting: "${caughtError.message}"`;
        }
      },
      {
        id: "t7_upload_panel_ui_lifecycle",
        title: "Test 7: UploadPanel UI Non-Blocking Cancel & Error Presentation",
        async run() {
          const panel = new UploadPanel("testUploadModal");

          // Test UI state when starting processing
          panel.showProcessing("capture.csv", 42000000);
          if (!panel.isProcessing) throw new Error("panel.isProcessing should be true");
          if (panel.btnClose.disabled) throw new Error("btnClose should NOT be disabled during processing");
          if (panel.btnCancel.disabled) throw new Error("btnCancel should NOT be disabled during processing");
          if (panel.btnCancel.textContent !== "Cancel Upload") {
            throw new Error(`btnCancel text expected 'Cancel Upload', got '${panel.btnCancel.textContent}'`);
          }

          // Test progress update to analyzing phase
          panel.updateProgress({ state: "running", progress: 0.65, stage_text: "Running RSSM forward rollout..." });
          const statusPill = document.getElementById("uploadStatusPill");
          if (statusPill.textContent !== "ANALYZING") {
            throw new Error(`Status pill expected 'ANALYZING', got '${statusPill.textContent}'`);
          }
          if (panel.btnCancel.textContent !== "Stop Waiting") {
            throw new Error(`btnCancel text in analyzing phase expected 'Stop Waiting', got '${panel.btnCancel.textContent}'`);
          }

          // Test error display
          panel.showError({ code: "bad_file", message: "Header missing timestamp column" });
          if (panel.isProcessing) throw new Error("panel.isProcessing should be false after error");
          const errCodeEl = document.getElementById("uploadErrorCode");
          if (errCodeEl.textContent !== "BAD_FILE") {
            throw new Error(`Error code badge expected 'BAD_FILE', got '${errCodeEl.textContent}'`);
          }
          const errMsgEl = document.getElementById("uploadErrorMessageText");
          if (!errMsgEl.textContent.includes("Header missing timestamp")) {
            throw new Error(`Error message text unexpected: '${errMsgEl.textContent}'`);
          }

          // Test reset state
          panel.resetState();
          if (panel.isProcessing) throw new Error("panel.isProcessing should be false after reset");
          if (!panel.errorBanner.classList.contains("hidden")) {
            throw new Error("Error banner should be hidden after resetState");
          }

          return "UploadPanel UI verified: Non-blocking controls, dynamic pill & honest error states.";
        }
      }
    ];

    async function runAll() {
      const container = document.getElementById("testContainer");
      const summaryBox = document.getElementById("summaryBox");
      let passCount = 0;
      let failCount = 0;

      for (const t of tests) {
        const card = document.createElement("div");
        card.className = "test-card";
        card.innerHTML = `
          <div class="test-header">
            <div class="test-title">${t.title}</div>
            <span class="status-badge pending" id="badge_${t.id}">RUNNING</span>
          </div>
          <div class="test-body" id="body_${t.id}">Executing test...</div>
        `;
        container.appendChild(card);

        const badge = document.getElementById(`badge_${t.id}`);
        const body = document.getElementById(`body_${t.id}`);

        try {
          const detail = await t.run();
          badge.className = "status-badge pass";
          badge.textContent = "PASS";
          body.textContent = detail || "Test passed successfully.";
          passCount++;
        } catch (err) {
          badge.className = "status-badge fail";
          badge.textContent = "FAIL";
          body.textContent = `Error: ${err.message}`;
          console.error(`Test ${t.id} failed:`, err);
          failCount++;
        }
      }

      summaryBox.innerHTML = `
        <strong>Test Results:</strong> ${passCount} / ${tests.length} Passed, ${failCount} Failed.<br>
        <span style="color:${failCount === 0 ? '#3fb950' : '#e2574c'}; font-weight:600;">
          ${failCount === 0 ? "✓ ALL H-12 UPLOAD & CANCELLATION TESTS PASSED" : "✗ SOME TESTS FAILED"}
        </span>
      `;
      window.__TEST_RESULTS__ = { passCount, failCount, total: tests.length };
    }

    runAll();
  </script>
</body>
</html>
