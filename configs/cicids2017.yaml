# M1 configuration - corrected CIC-IDS2017 (decisions.md D-001)
dataset: cicids2017
raw_dir: data/raw/cicids2017_improved
processed_dir: data/processed/cicids2017

window:
  length_s: 60.0    # D-002
  stride_s: 30.0
  use_trend_features: true

# Forecast horizon in windows. 10 x 30 s stride = 5 minutes of look-ahead, which is the order of
# magnitude of the gap between the Dropbox download and the internal scan on the infiltration day.
horizon_k: 10

# The monitored network. Used for scan-direction refinement (D-012) and for directional byte
# features; 172.16.0.1 is the attacker-side NAT in this capture, so it is deliberately *not* here.
internal_prefixes:
  - "192.168.10."

seed: 42
